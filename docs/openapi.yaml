          description: "Hasil operasi"
          content:
            "application/json":
              schema:
                allOf:
                  - "$ref": "#/components/schemas/Success"
                  - type: "object"
                    properties:
                      data:
                        "$ref": "#/components/schemas/Project"
        '409':
          "$ref": "#/components/responses/RevisionConflict"
        '422':
          "$ref": "#/components/responses/Unprocessable"
        default:
          "$ref": "#/components/responses/ProtectedError"
  "/panelist/connection":
    post:
      tags:
        - "Telemetry"
      x-roles:
        - "panelis"
      operationId: "recordTelemetry"
      summary: "Catat observasi koneksi dan durasi pengisian panelis"
      description: "Observasi browser, bukan verifikasi jaringan atau penilaian kualitas manusia. Scope user/proyek/mapel diambil dari sesi, harus panelis aktif yang ditugaskan pada putaran nyata aktif dan revisi yang cocok, dalam periode, tidak dikecualikan, tanpa latihan terbuka/finalNBK. Nilai ringkasan terakhir menimpa catatan scope yang sama; durasi jawaban mentah tidak disimpan. Ambang peringatan koneksi: >=3 sampel dan median >=1500 ms; kecepatan: >=5 isian terakhir berurutan <=5 detik. Monitoring admin/PIC membawa ringkasan ini."
      parameters:
        - "$ref": "#/components/parameters/SessionId"
        - "$ref": "#/components/parameters/BrowserOrigin"
        - "$ref": "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/TelemetryInput"
      responses:
        '200':
          description: "Hasil operasi"
          content:
            "application/json":
              schema:
                allOf:
                  - "$ref": "#/components/schemas/Success"
                  - type: "object"
                    properties:
                      data:
                        "$ref": "#/components/schemas/PanelistTelemetry"
        '409':
          "$ref": "#/components/responses/RevisionConflict"
        '422':
          "$ref": "#/components/responses/Unprocessable"
        default:
          "$ref": "#/components/responses/ProtectedError"
  "/project-workbook/template":
    get:
      tags:
        - "Projects"
      x-roles:
        - "admin_super"
      operationId: "projectWorkbookTemplate"
      summary: "Unduh template untuk membuat proyek Draft dari Excel"
      description: "Workbook berisi empat sheet input Proyek, Mapel, Butir, Personel serta Panduan dan Referensi mapel. Tidak terikat proyek existing. Template tidak memuat password."
      parameters:
        - "$ref": "#/components/parameters/SessionId"
      responses:
        '200':
          description: "Template XLSX proyek baru"
          headers:
            Content-Disposition:
              schema:
                type: "string"
              example: "attachment; filename=template-proyek-standard-setting.xlsx"
          content:
            "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet":
              schema:
                type: "string"
                format: "binary"
        '409':
          "$ref": "#/components/responses/Conflict"
        default:
          "$ref": "#/components/responses/ProtectedError"
  "/project-workbook/import":
    post:
      tags:
        - "Projects"
      x-roles:
        - "admin_super"
      operationId: "importProjectWorkbook"
      summary: "Preview atau buat Draft baru dari workbook lengkap"
      description: "File .xlsx maksimal 5 MiB dan total 5000 baris input. Sheet/header tepat: Proyek (nama_proyek, deskripsi, tanggal_mulai, tanggal_selesai, pembulatan, kumpulkan_kontak), Mapel (mata_pelajaran, definisi_kandidat), Butir (mata_pelajaran, id_butir), Personel (mata_pelajaran, role, nama, username). Formula, macro, referensi workbook eksternal dan kolom tambahan ditolak. Tanggal teks YYYY-MM-DD termasuk hari selesai di Asia/Jakarta. Semua kesalahan baris dikembalikan dengan HTTP 200 valid=false/applied=false tanpa penyimpanan. apply=false hanya preview; apply=true memvalidasi ulang lalu menyimpan proyek Draft, alokasi butir dan akun baru secara atomik. Gunakan mapel dan ID bank tersedia; tepat satu PIC dan 1–1000 panelis per mapel. Username opsional; kosong dibuat otomatis. Password mengikuti INITIAL_PASSWORD dan wajib diganti. Proyek default 3 putaran, simulasi nonaktif, tanpa aktivasi. Tidak memperbarui proyek/akun existing; kegagalan operasional membatalkan seluruh transaksi."
      parameters:
        - "$ref": "#/components/parameters/SessionId"
        - "$ref": "#/components/parameters/BrowserOrigin"
        - "$ref": "#/components/parameters/CSRFToken"
      responses:
        '200':
          description: "Hasil operasi"
          content:
            "application/json":
              schema:
                allOf:
                  - "$ref": "#/components/schemas/Success"
                  - type: "object"
                    properties:
                      data:
                        "$ref": "#/components/schemas/ProjectWorkbookPreview"
        '409':
          "$ref": "#/components/responses/Conflict"
        '422':
          "$ref": "#/components/responses/Unprocessable"
        default:
          "$ref": "#/components/responses/ProtectedError"
      requestBody:
        required: true
        content:
          "multipart/form-data":
            schema:
              type: "object"
              required:
                - "file"
              properties:
                file:
                  type: "string"
                  format: "binary"
                  description: "Workbook .xlsx, maksimal 5 MiB"
                apply:
                  type: "string"
                  enum:
                    - "false"
                    - "true"
                  default: "false"
                  description: "Preview default; true membuat Draft setelah validasi ulang"
  "/users/{id}":
    parameters:
      - name: "id"
        in: "path"
        required: true
        schema:
          type: "string"
        description: "ID akun peserta aktif dalam penugasan; bukan username dan bukan akun superadmin"
    patch:
      tags:
        - "Users"
      x-roles:
        - "admin_super"
      operationId: "editParticipantAccount"
      summary: "Ubah nama dan username peserta"
      description: "Memerlukan projectVersion terkini; tidak mengubah role/proyek/mapel/password/status. Nama disinkronkan ke slot/roster. Perubahan username menaikkan authVersion sehingga sesi lama ditolak. Proyek completed, akun removed, atau slot tidak sesuai ditolak. Transaksi menaikkan versi proyek."
      parameters:
        - "$ref": "#/components/parameters/SessionId"
        - "$ref": "#/components/parameters/BrowserOrigin"
        - "$ref": "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/ParticipantAccountEdit"
      responses:
        '200':
          description: "Hasil operasi"
          content:
            "application/json":
              schema:
                allOf:
                  - "$ref": "#/components/schemas/Success"
                  - type: "object"
                    properties:
                      data:
                        "$ref": "#/components/schemas/User"
        '409':
          "$ref": "#/components/responses/Conflict"
        '422':
          "$ref": "#/components/responses/Unprocessable"
        default:
          "$ref": "#/components/responses/ProtectedError"
        '404':
          "$ref": "#/components/responses/NotFound"
    delete:
      tags:
        - "Users"
      x-roles:
        - "admin_super"
      operationId: "removeParticipantAccount"
      summary: "Lepas peserta dari penugasan proyek"
      description: "Soft remove: akun disimpan untuk histori, active=false, removed=true dan authVersion bertambah. Slot panelis dihapus; slot PIC diganti slot kosong. Roster/readiness proyek diperbarui, versi proyek dinaikkan, respons/snapshot historis tetap tersimpan. Proyek completed dan superadmin ditolak."
      parameters:
        - "$ref": "#/components/parameters/SessionId"
        - "$ref": "#/components/parameters/BrowserOrigin"
        - "$ref": "#/components/parameters/CSRFToken"
        - name: "projectVersion"
          in: "query"
          required: true
          schema:
            type: "integer"
            minimum: 0
          description: "Versi proyek dari GET konfigurasi terbaru"
        - name: "confirmation"
          in: "query"
          required: true
          schema:
            type: "string"
            enum:
              - "HAPUS PESERTA"
      responses:
        '200':
          description: "Hasil operasi"
          content:
            "application/json":
              schema:
                allOf:
                  - "$ref": "#/components/schemas/Success"
                  - type: "object"
                    properties:
                      data:
                        "$ref": "#/components/schemas/RemovedResult"
        '409':
          "$ref": "#/components/responses/Conflict"
        '422':
          "$ref": "#/components/responses/Unprocessable"
        default:
          "$ref": "#/components/responses/ProtectedError"
        '404':
          "$ref": "#/components/responses/NotFound"
components:
  securitySchemes:
    CookieAuth:
      type: apiKey
      in: cookie
      name: __Host-ss_session
      description: Cookie Secure HttpOnly SameSite=Lax produksi; development HTTP memakai ss_session. Semua mutasi memerlukan Origin yang diizinkan dan X-CSRF-Token dari metadata sesi. X-Session-ID mendeteksi metadata tab lama. Bearer dan auth/refresh tidak didukung.
  parameters:
    BrowserOrigin:
      name: "Origin"
      in: "header"
      required: true
      schema:
        type: "string"
      description: "Origin browser dalam ALLOWED_ORIGINS; wajib pada seluruh mutasi cookie-auth."
    CSRFToken:
      name: "X-CSRF-Token"
      in: "header"
      required: true
      schema:
        type: "string"
      description: "Token CSRF dari metadata login/session yang sesuai cookie HttpOnly aktif."
    SessionId:
      name: "X-Session-ID"
      in: "header"
      required: false
      schema:
        type: "string"
      description: "sessionId metadata tab. Jika dikirim dan tidak cocok dengan sesi cookie, server mengembalikan SESSION_CHANGED."
    ProjectId:
      name: id
      in: path
      required: true
      schema:
        type: string
        example: project_contoh
      description: Project.id dari response/list row, bukan code atau nama
    ProjectQuery:
      name: projectId
      in: query
      schema:
        type: string
      description: Opsional; id proyek untuk filter, atau override scope pada PIC monitoring
    SubjectQuery:
      name: subjectCode
      in: query
      schema:
        type: string
        example: MAT
      description: Kode mapel; wajib secara bisnis untuk monitoring meski handler menerima query kosong
  requestBodies:
    ProjectBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Project'
          example:
            name: Standard Setting 2026
            startDate: '2026-10-11T17:00:00Z'
            endDate: '2026-10-31T17:00:00Z'
            status: draft
            wizardStep: 1
            subjects: []
            accountsGenerated: false
            plannedRounds: 3
            simulationEnabled: false
            collectContactPanelis: false
            roundingPolicy: ceil_1pp
  responses:
    Error:
      description: Error handler umum; status sesuai operasi atau 500 dari kegagalan service/store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ProtectedError:
      description: >-
        401 sesi invalid; 403 role/scope; 428 password wajib diganti atau CONTACT_REQUIRED pada scoring; 409
        REVISION_CONFLICT; 422 validasi/PERIOD_CLOSED; 500 kegagalan service/store; 503 layanan tidak
        tersedia. Lihat respons spesifik operasi.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: Credential/session/Bearer ditolak
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: Role tidak diizinkan atau scope proyek/mapel di luar penugasan aktif.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    PasswordRequired:
      description: Akun aktif masih wajib mengganti password
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unprocessable:
      description: Payload/validasi tidak sesuai
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: Konfirmasi/status/alokasi/versi/aksi tidak dapat diproses; beberapa handler memakai REVISION_CONFLICT.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Handler monitoring/form memetakan service error menjadi 404
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    AuthResponse:
      description: Session baru; password hash tidak ditampilkan
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Success'
              - type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AuthResult'
    ProjectResponse:
      description: Dokumen Project lengkap
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Success'
              - type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Project'
    UsersResponse:
      description: Array user tanpa passwordHash; kosong berupa []
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Success'
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
    MonitoringResponse:
      description: >-
        Scope, item dan progres putaran aktif/final; statistik hanya ketika semua respons lengkap. ICC tidak
        dihitung.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Success'
              - type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Monitoring'
    SubmissionsResponse:
      description: Array Submission; kosong berupa []
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Success'
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Submission'
    ContactRequired:
      description: >-
        Akun masih wajib mengganti password, atau CONTACT_REQUIRED: lengkapi kontak profil sesuai kebijakan
        proyek sebelum borang/feedback/simpan/review.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            status: error
            message: Lengkapi kontak profil sesuai kebijakan proyek sebelum borang/feedback/simpan/review.
            code: CONTACT_REQUIRED
    RevisionConflict:
      description: >-
        Revisi putaran, versi respons/kontak atau definisi kandidat berubah. Muat ulang dan tinjau; jangan
        overwrite otomatis.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            status: error
            message: >-
              Revisi putaran, versi respons/kontak atau definisi kandidat berubah. Muat ulang dan tinjau;
              jangan overwrite otomatis.
            code: REVISION_CONFLICT
    PeriodClosed:
      description: >-
        Validasi jawaban/payload ditolak, atau PERIOD_CLOSED: penilaian sebelum startDate atau pada/sesudah
        endDate; antrean offline tetap ditolak.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            status: error
            message: Penilaian berada sebelum startDate atau pada/sesudah endDate; antrean offline tetap ditolak.
            code: PERIOD_CLOSED
    SecurityUnavailable:
      description: Kontrol keamanan/session Redis atau layanan yang diperlukan tidak tersedia; tanpa bypass.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RateLimited:
      description: Blokir sementara percobaan login; coba lagi setelah Retry-After detik.
      headers:
        Retry-After:
          description: Jumlah detik sampai percobaan berikutnya; pembulatan ke atas, minimal 1.
          schema:
            type: string
            pattern: ^[1-9][0-9]*$
            example: '900'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    Success:
      type: object
      required:
        - status
        - data
      properties:
        status:
          type: string
          enum:
            - success
    ErrorEnvelope:
      type: object
      required:
        - status
        - message
      properties:
        status:
          type: string
          enum:
            - error
        message:
          type: string
        errors:
          type: array
          items:
            type: string
          description: Hanya activation checklist response
        code:
          type: string
          description: >-
            Kode terstruktur bila tersedia: CONTACT_REQUIRED (428), REVISION_CONFLICT (409), PERIOD_CLOSED
            (422). Error umum dapat tidak menyertakan kode atau memakai string kosong.
    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
    Role:
      type: string
      enum:
        - admin_super
        - pic_mapel
        - panelis
    QuestionType:
      type: string
      enum:
        - pilihan_ganda
        - pilihan_ganda_kompleks
        - essay
    UserView:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        name:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        projectId:
          type: string
        projectName:
          type: string
        subjectCode:
          type: string
        mustChangePassword:
          type: boolean
        contactRequired:
          type: boolean
      description: >-
        Tampilan user untuk routing sesi. contactRequired dihitung dari kebijakan/kontak terkini, bukan klaim
        sesi server.
    User:
      allOf:
        - $ref: '#/components/schemas/UserView'
        - type: object
          properties:
            active:
              type: boolean
            removed:
              type: boolean
            slotId:
              type: string
            lastLoginAt:
              type: string
              format: date-time
              description: Diisi pada login berhasil
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
    AuthResult:
      type: object
      properties:
        sessionId:
          type: string
          description: Fingerprint publik, bukan credential cookie
        csrfToken:
          type: string
        authVersion:
          type: integer
        expiresAt:
          type: integer
          format: int64
          description: Waktu kedaluwarsa absolut, Unix milliseconds
        user:
          $ref: '#/components/schemas/UserView'
    Claims:
      type: object
      properties:
        name:
          type: string
        username:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        projectId:
          type: string
        subjectCode:
          type: string
        mustChangePassword:
          type: boolean
        sub:
          type: string
          description: User ID
        iss:
          type: string
          example: standard-setting
        iat:
          type: integer
          format: int64
        exp:
          type: integer
          format: int64
        nbf:
          type: integer
          format: int64
        aud:
          type: array
          items:
            type: string
        jti:
          type: string
    Project:
      type: object
      description: >-
        Model body dan response. Pada create Draft sebagian field boleh belum diisi; tidak ada required list
        umum agar tidak mengklaim validasi yang belum ada.
      properties:
        workflowVersion:
          type: "integer"
          minimum: 0
          readOnly: true
          description: "0 legacy; proyek baru versi 1 mengharuskan receipt selesai dan penetapan NBK final eksplisit."
        plannedRounds:
          type: "integer"
          minimum: 0
          maximum: 20
          default: 3
          description: "Proyek baru minimal 1 (default 3); 0 legacy tanpa batas rencana. Dapat diubah admin saat Draft; setelah aktif hanya PIC menambah melalui /pic/round-plan/extend."
        simulationEnabled:
          type: "boolean"
          description: "Aktifkan sesi latihan terpisah sebelum penilaian nyata; pengaturan hanya dapat diubah saat Draft."
        id:
          type: string
        version:
          type: integer
          minimum: 0
        itemsEditable:
          type: boolean
          readOnly: true
        code:
          type: string
        name:
          type: string
        description:
          type: string
        startDate:
          type: string
          format: date-time
          nullable: true
          description: >-
            UTC instant; input tanggal Asia/Jakarta dimulai00.00 inklusif. Tanggal legacy dipertahankan sampai
            admin mengedit.
        endDate:
          type: string
          format: date-time
          nullable: true
          description: >-
            UTC instant eksklusif; input tanggal selesai dikodekan00.00 WIB hari sesudah tanggal itu. Simpan
            sebelum mulai/pada atau setelah akhir ditolak.
        status:
          type: string
          enum:
            - draft
            - active
            - completed
        wizardStep:
          type: integer
        subjects:
          type: array
          items:
            $ref: '#/components/schemas/ProjectSubject'
        accountsGenerated:
          type: boolean
        createdBy:
          type: string
        completedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        featureVersion:
          type: integer
          minimum: 0
          readOnly: true
          description: 0 legacy; proyek baru menggunakan fitur versi1.
        collectContactPanelis:
          type: boolean
        roundingPolicy:
          type: string
          enum:
            - none
            - ceil_1pp
            - nearest_1pp
          description: Proyek baru default ceil_1pp; migrasi legacy none.
        sourceProjectId:
          type: string
          readOnly: true
        evaluationClosed:
          type: boolean
    ProjectSubject:
      type: object
      properties:
        practiceStatus:
          type: "string"
          enum:
            - ""
            - "open"
            - "closed"
          readOnly: true
          description: "Kosong bila tidak ada latihan; aktivasi proyek simulasi membuka latihan per mapel, PIC menutupnya secara eksplisit."
        finalNBK:
          allOf:
            - "$ref": "#/components/schemas/NBKDecision"
          readOnly: true
          description: "Hanya ada setelah PIC mengunci snapshot NBK final mapel."
        code:
          type: string
          example: MAT
        name:
          type: string
          example: Matematika
        itemIds:
          type: array
          items:
            type: string
        picUserId:
          type: string
        picName:
          type: string
        panelistCount:
          type: integer
        panelistUserIds:
          type: array
          items:
            type: string
        panelistNames:
          type: array
          items:
            type: string
        slots:
          type: array
          items:
            $ref: '#/components/schemas/PersonnelSlot'
        candidateDefinition:
          type: string
          description: Definisi kandidat per mapel; wajib sebelum aktivasi proyek baru.
        candidateVersion:
          type: integer
          minimum: 0
          readOnly: true
        candidateHistory:
          type: array
          readOnly: true
          items:
            $ref: '#/components/schemas/CandidateDefinitionRevision'
    Item:
      type: object
      properties:
        id:
          type: string
          example: MAT-001
        subjectCode:
          type: string
        subjectName:
          type: string
        questionType:
          $ref: '#/components/schemas/QuestionType'
        maxScore:
          type: integer
        rubric:
          type: array
          items:
            type: string
        usageStatus:
          type: string
          enum:
            - available
            - allocated
            - tested
        projectId:
          type: string
        projectName:
          type: string
        projectHistory:
          type: array
          items:
            type: object
            properties:
              projectId:
                type: string
              projectName:
                type: string
        readOnly:
          type: boolean
        finalResult:
          $ref: '#/components/schemas/ItemResult'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ItemResult:
      type: object
      properties:
        panelistIds:
          type: array
          items:
            type: string
