openapi: 3.0.3
info:
  title: Standard Setting API
  version: '2026-10-26'
  description: >-
    Kontrak statis berdasarkan seluruh file produksi internal/httpapi/*.go dan model aktif. Base path /api/v1.
    JSON sukses memakai HTTP 200 dan envelope status/data; unduhan CSV/XLSX mengirim berkas langsung. Akun
    dibaca ulang dari MongoDB, authVersion mencabut sesi lama, dan X-Request-ID dibuat server untuk korelasi
    audit. Password/hash tidak diekspor. Operasi multi-document memakai transaksi MongoDB replica set. Borang
    memakai gate kontak, periode UTC dan revisi optimistik. Snapshot final tidak dibangun ulang dari roster
    saat ini. Dokumen ini menjelaskan kontrak, bukan laporan kelulusan QA/deployment.
servers:
  - url: http://127.0.0.1:18081/api/v1
    description: Default development
  - url: /api/v1
    description: Relative path bila aplikasi ditempatkan di origin yang sama
security:
  - CookieAuth: []
tags:
  - name: Health
  - name: Auth
  - name: Projects
  - name: Users
  - name: Items
  - name: Monitoring
  - name: Rounds
  - name: Panelist
  - name: Profile
  - name: Reports
  - name: Impact
  - name: Evaluation
  - name: Audit
  - name: Practice
  - name: Telemetry
paths:
  /health:
    get:
      tags:
        - Health
      security: []
      operationId: health
      summary: Respons hidup service
      description: Tidak memeriksa ulang MongoDB/Redis. FE tidak memanggilnya otomatis.
      responses:
        '200':
          description: Server merespons
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - service
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                  service:
                    type: string
                    enum:
                      - standard-setting
  /auth/login:
    post:
      tags:
        - Auth
      security: []
      operationId: login
      summary: Login dengan username dan password
      description: >-
        User aktif dan bcrypt harus cocok. Membuat cookie HttpOnly dan sesi Redis absolut 15 menit. Login terbaru menggantikan sesi lama. Origin yang diizinkan dan Content-Type application/json wajib. Counter atomik
        Redis: 5 percobaan/username dan 20/IP per15menit; sukses mereset username, IP tetap membatasi
        spraying. Header IP hanya dipercaya dari proxy yang dikonfigurasi. Kegagalan tidak membocorkan
        username terdaftar. Login/gagal login diaudit tanpa rahasia.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              username: superadmin
              password: <password input user>
      responses:
        '200':
          $ref: '#/components/responses/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/SecurityUnavailable'
        default:
          $ref: '#/components/responses/Error'
  /auth/session:
    get:
      tags: [Auth]
      operationId: browserState
      summary: Pulihkan metadata sesi dari cookie; tidak memperpanjang expiry
      responses:
        '200':
          $ref: '#/components/responses/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/SecurityUnavailable'
  /auth/logout:
    post:
      tags: [Auth]
      operationId: browserLogout
      summary: Cabut sesi pemanggil di Redis
      description: Origin dan X-CSRF-Token wajib. Tidak mengirim Set-Cookie untuk mencegah respons lama menghapus cookie baru. Cookie yang dicabut tetap tidak valid.
      responses:
        '200':
          description: Sesi dicabut
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Origin atau CSRF tidak valid
        '503':
          $ref: '#/components/responses/SecurityUnavailable'
  /auth/events:
    get:
      tags: [Auth]
      operationId: browserEvents
      summary: Notifikasi sesi melalui SSE dengan cookie
      description: Event session memuat sessionId, code dan message. SESSION_REPLACED menampilkan Anda telah login di perangkat lain. Tidak ada credential dalam URL.
      responses:
        '200':
          description: Stream event dan heartbeat
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/SecurityUnavailable'
  /auth/change-password:
    post:
      tags:
        - Auth
      x-roles:
        - admin_super
        - pic_mapel
        - panelis
      operationId: changePassword
      summary: Ganti password first login
      description: |-
        UserId dari sesi Redis. Origin dan X-CSRF-Token wajib. Confirmation password hanya divalidasi FE, tidak dikirim.
        Endpoint tidak membutuhkan passwordChanged middleware. New password minimal
        6 byte di BE dan berbeda dari current password. Respons menerbitkan session
        baru dengan mustChangePassword false; FE mengganti metadata sesi di memori dan browser menerima cookie baru.
         Password dan authVersion diperbarui bersamaan dengan audit dalam transaksi; sesi lama ditolak. Tidak menyediakan kemampuan melihat password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - currentPassword
                - newPassword
              properties:
                currentPassword:
                  type: string
                newPassword:
                  type: string
                  minLength: 6
      responses:
        '200':
          $ref: '#/components/responses/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '503':
          $ref: '#/components/responses/SecurityUnavailable'
        default:
          $ref: '#/components/responses/Error'
  /me:
    get:
      tags:
        - Auth
      x-roles:
        - admin_super
        - pic_mapel
        - panelis
      operationId: me
      summary: Profil routing sesi aktif
      description: >-
        Membaca user aktif dan kebijakan kontak terkini. Respons UserView berisi id dan contactRequired, bukan
        identitas sesi. Password wajib sudah diganti; kontak belum lengkap tetap dapat membaca /me.
      responses:
        '200':
          description: Profil sesi aktif
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UserView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '428':
          $ref: '#/components/responses/PasswordRequired'
        '503':
          $ref: '#/components/responses/SecurityUnavailable'
  /projects:
    get:
      tags:
        - Projects
      x-roles:
        - admin_super
      operationId: listProjects
      summary: Daftar seluruh proyek
      description: Urutan updatedAt descending. Pencarian/statistik di FE; tidak ada query search/pagination.
      responses:
        '200':
          description: Daftar Project, dapat null bila kosong
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Project'
        default:
          $ref: '#/components/responses/ProtectedError'
    post:
      tags:
        - Projects
      x-roles:
        - admin_super
      operationId: createProject
      summary: Simpan Draft baru
      description: >-
        Saat id kosong, BE membuat id/code/status Draft dan createdBy dari akun. Alokasi item dan penyimpanan
        Project dalam transaksi; field kepemilikan/status client diabaikan.
      requestBody:
        $ref: '#/components/requestBodies/ProjectBody'
      responses:
        '200':
          $ref: '#/components/responses/ProjectResponse'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        default:
          $ref: '#/components/responses/ProtectedError'
  /projects/{id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags:
        - Projects
      x-roles:
        - admin_super
      operationId: getProject
      summary: Baca konfigurasi Project
      description: id dari row daftar proyek/page.params. Data digunakan hydrate form edit.
      responses:
        '200':
          $ref: '#/components/responses/ProjectResponse'
        default:
          $ref: '#/components/responses/ProtectedError'
    put:
      tags:
        - Projects
      x-roles:
        - admin_super
      operationId: updateProject
      summary: Simpan konfigurasi lengkap Project
      description: >
        Bukan PATCH; ReplaceOne dokumen penuh. Path id mengalahkan body.id. FE

        mempertahankan field hasil GET termasuk code, createdBy dan timestamps.

        Update Draft dan Active. Version body harus cocok dengan versi tersimpan. Code/status/createdBy tetap;
        perubahan butir hanya sebelum ada respons. Slot personel menjaga identitas existing. Completed
        terkunci secara struktural.
      requestBody:
        $ref: '#/components/requestBodies/ProjectBody'
      responses:
        '200':
          $ref: '#/components/responses/ProjectResponse'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        default:
          $ref: '#/components/responses/ProtectedError'
    delete:
      tags:
        - Projects
      x-roles:
        - admin_super
      operationId: deleteProject
      summary: Hapus hanya Project Draft
      description: >-
        Hanya Draft; menghapus project, melepas alokasi dan menonaktifkan akun proyek dalam transaksi. Akun
        tetap disimpan sebagai jejak historis.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - confirmation
              properties:
                confirmation:
                  type: string
                  enum:
                    - HAPUS PROYEK
      responses:
        '200':
          description: Project dihapus
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          deleted:
                            type: boolean
                            example: true
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/ProtectedError'
  /projects/{id}/activate:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags:
        - Projects
      x-roles:
        - admin_super
      operationId: activateProject
      summary: Validasi checklist dan aktifkan proyek
      description: >-
        Tanpa body. Hanya Draft dengan checklist lengkap, akun aktif ditugaskan dan item dimiliki proyek.
        Membuka round 1 active tiap mapel dan aktivasi dalam transaksi. Jika simulationEnabled=true, latihan dibuka
        per mapel dan penilaian nyata tetap terkunci sampai PIC menutup latihan.
      responses:
        '200':
          $ref: '#/components/responses/ProjectResponse'
        '422':
          description: Checklist belum lengkap dengan errors array
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                status: error
                message: konfigurasi proyek belum lengkap
                errors:
                  - akun proyek belum dibuat
        default:
          $ref: '#/components/responses/ProtectedError'
  /projects/{id}/complete:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags:
        - Projects
      x-roles:
        - admin_super
      operationId: completeProject
      summary: Tandai proyek active sebagai completed
      description: >-
        Hanya active; setiap mapel wajib punya putaran finalized dengan semua respons valid dan lengkap.
        Pada workflowVersion>=1 setiap mapel wajib memiliki finalNBK terkunci; snapshot pilihan keputusan tersebut
        dipakai sebagai hasil final. Transaksi menyimpan snapshot finalResult per item, menandai
        tested/readOnly, menutup round kosong dan menyelesaikan project.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - confirmation
              properties:
                confirmation:
                  type: string
                  enum:
                    - SELESAIKAN PROYEK
      responses:
        '200':
          $ref: '#/components/responses/ProjectResponse'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/ProtectedError'
  /projects/{id}/accounts/generate:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags:
        - Users
      x-roles:
        - admin_super
      operationId: generateAccounts
      summary: Rekonsiliasi PIC dan Panelis proyek Draft atau Active
      description: >-
        Payload dari slot akun tersimpan pada langkah 4. Username otomatis atau custom; password akun baru
        dari INITIAL_PASSWORD. Identitas/password/status existing dipertahankan. Seluruh batch dalam transaksi
        dan idempotent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - accounts
              properties:
                accounts:
                  type: array
                  items:
                    type: object
                    required:
                      - slotId
                      - name
                      - role
                      - subjectCode
                    properties:
                      slotId:
                        type: string
                      username:
                        type: string
                        description: Opsional; kosong menghasilkan username otomatis untuk slot baru
                      name:
                        type: string
                      role:
                        type: string
                        enum:
                          - pic_mapel
                          - panelis
                      subjectCode:
                        type: string
                        example: MAT
      responses:
        '200':
          $ref: '#/components/responses/UsersResponse'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        default:
          $ref: '#/components/responses/ProtectedError'
  /subjects:
    get:
      tags:
        - Items
      x-roles:
        - admin_super
      operationId: listSubjects
      summary: Katalog mapel dan jumlah butir setiap status
      responses:
        '200':
          description: Katalog
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Subject'
        default:
          $ref: '#/components/responses/ProtectedError'
    post:
      tags:
        - Items
      x-roles:
        - admin_super
      operationId: createSubject
      summary: Tambah mapel dengan kode dan nama unik
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              anyOf:
                - required: [kode_mapel]
                - required: [code]
              properties:
                kode_mapel:
                  type: string
                  minLength: 2
                  maxLength: 20
                  pattern: '^[A-Za-z][A-Za-z0-9_-]{1,19}$'
                  description: Kode manual, dinormalisasi menjadi huruf besar. Harus unik.
                  example: SEJ
                code:
                  type: string
                  description: Alias kode_mapel; jika keduanya dikirim harus sama setelah normalisasi.
                name:
                  type: string
                  minLength: 2
                  maxLength: 100
      responses:
        '200':
          description: Mapel dibuat
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Subject'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/ProtectedError'
  /projects/{id}/accounts:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags:
        - Users
      x-roles:
        - admin_super
      operationId: accountRows
      summary: Slot akun aktif, nonaktif, pending dan dihapus
      responses:
        '200':
          description: Akun dan slot
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AccountRow'
        default:
          $ref: '#/components/responses/ProtectedError'
  /users/{id}/active:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    patch:
      tags:
        - Users
      x-roles:
        - admin_super
      operationId: userActive
      summary: Ubah akses peserta dan invalidasi sesi lama
      description: Tidak untuk superadmin atau penugasan removed; nonaktif dikeluarkan dari roster efektif.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - active
              properties:
                active:
                  type: boolean
      responses:
        '200':
          description: Status diperbarui
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/ProtectedError'
  /users/{id}/reset-password:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      tags:
        - Users
      x-roles:
        - admin_super
      operationId: resetPassword
      summary: Reset ke INITIAL_PASSWORD dan wajib ganti pada login berikutnya
      description: Access dan refresh lama ditolak; reset tidak mengaktifkan akun nonaktif.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - confirmation
              properties:
                confirmation:
                  type: string
                  enum:
                    - RESET PASSWORD
      responses:
        '200':
          description: Password direset tanpa mengirim password di response
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        default:
          $ref: '#/components/responses/ProtectedError'
  /projects/{id}/templates/{step}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: step
        in: path
        required: true
        schema:
          type: integer
          enum:
            - 2
            - 3
            - 4
    get:
      tags:
        - Projects
      x-roles:
        - admin_super
      operationId: template
      summary: Unduh template XLSX terikat proyek, langkah dan version
      description: >-
        Langkah 3–4 memerlukan kebutuhan panelis lengkap. Kolom prefill diverifikasi kembali saat impor.
        Langkah 4 memiliki kolom mata_pelajaran, role, nama, username, password. Password selalu kosong
        pada template; wajib diisi hanya untuk akun baru dan harus tetap kosong untuk akun existing.
      responses:
        '200':
          description: Workbook XLSX
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/ProtectedError'
  /projects/{id}/imports/{step}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: step
        in: path
        required: true
        schema:
          type: integer
          enum:
            - 2
            - 3
            - 4
    post:
      tags:
        - Projects
      x-roles:
        - admin_super
      operationId: importWorkbook
      summary: Validasi atau terapkan workbook atomik tanpa perubahan parsial
      description: >-
        Maksimal 5 MB dan 5000 baris; formula/macro/external links ditolak. valid=false mengembalikan semua
        error baris tanpa mutasi. apply=true memeriksa ulang lalu menyimpan transaksi.
        Pada langkah 4, username dan password wajib untuk akun baru. Password minimal 6 karakter,
        maksimal 72 byte dan tidak boleh hanya spasi; spasi tepi dipertahankan. Satu password kosong
        atau invalid menolak seluruh file. Akun baru memakai password tersebut tanpa kewajiban ganti
        password pertama; kebutuhan kontak proyek tetap berlaku. Password akun existing harus kosong
        dan kredensialnya dipertahankan. Password tidak dikembalikan pada preview maupun error.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                apply:
                  type: string
                  enum:
                    - 'true'
                    - 'false'
                  default: 'false'
      responses:
        '200':
          description: Preview atau hasil impor; periksa valid/applied
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ImportPreview'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        default:
          $ref: '#/components/responses/ProtectedError'
  /projects/{id}/monitoring/all:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags:
        - Monitoring
      x-roles:
        - admin_super
      operationId: monitoringAll
      summary: Snapshot monitoring seluruh mapel dan roster aktif
      parameters:
        - name: round
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
          description: 0 memilih terakhir tiap mapel. Putaran belum ada menghasilkan unavailable pada mapel itu.
      responses:
        '200':
          description: Ringkasan semua mapel
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      project:
                        $ref: '#/components/schemas/Project'
                      subjects:
                        type: array
                        items:
                          $ref: '#/components/schemas/Monitoring'
        default:
          $ref: '#/components/responses/ProtectedError'
  /users:
    get:
      tags:
        - Users
      x-roles:
        - admin_super
      operationId: listUsers
      summary: Daftar akun, opsional filter proyek
      description: >-
        Halaman akun memuat semua lalu memfilter lokal; wizard edit menggunakan projectId. Urutan createdAt
        descending.
      parameters:
        - $ref: '#/components/parameters/ProjectQuery'
      responses:
        '200':
          $ref: '#/components/responses/UsersResponse'
        default:
          $ref: '#/components/responses/ProtectedError'
    post:
      tags:
        - "Users"
      x-roles:
        - "admin_super"
      operationId: "createParticipantAccount"
      summary: "Tambah akun PIC atau panelis ke proyek"
      description: "Proyek Draft/Active dan projectVersion terkini wajib. Mengisi slot kosong yang cocok atau menambah slot baru; satu PIC per mapel, maksimal 1000 panelis. Username unik; nama dan username dinormalisasi. Akun aktif menggunakan INITIAL_PASSWORD, wajib mengganti password. Menyinkronkan roster/slots dan readiness serta menaikkan versi proyek dalam transaksi."
      parameters:
        - "$ref": "#/components/parameters/SessionId"
        - "$ref": "#/components/parameters/BrowserOrigin"
        - "$ref": "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/ParticipantAccountInput"
      responses:
        '200':
          description: "Hasil operasi"
          content:
            "application/json":
              schema:
                allOf:
                  - "$ref": "#/components/schemas/Success"
                  - type: "object"
                    properties:
                      data:
                        "$ref": "#/components/schemas/User"
        '409':
          "$ref": "#/components/responses/Conflict"
        '422':
          "$ref": "#/components/responses/Unprocessable"
        default:
          "$ref": "#/components/responses/ProtectedError"
        '404':
          "$ref": "#/components/responses/NotFound"
  /items:
    get:
      tags:
        - Items
      x-roles:
        - admin_super
      operationId: listItems
      summary: Bank butir dengan filter opsional
      description: >-
        Drawer FE mengirim subjectCode dan onlyAvailable=false lalu menerapkan toggle selectable lokal. Query
        true di BE hanya usageStatus available. Urutan id ascending.
