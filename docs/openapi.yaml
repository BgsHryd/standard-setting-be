  /pic/rounds/{action}:
    post:
      tags:
        - Rounds
      x-roles:
        - pic_mapel
      operationId: roundAction
      summary: Finalisasi atau rollback putaran aktif
      description: |-
        Dua tahap konfirmasi di FE, satu request eksekusi di BE. Scope dari sesi.
        finalize menyimpan snapshot n finalized dan membuat n+1 active hanya jika belum mencapai plannedRounds
        (atau plannedRounds=0 legacy). Pada putaran rencana terakhir, respons tetap round finalized tanpa
        membuat putaran tambahan. rollback putaran aktif mengaktifkan n-1 setelah n rolled_back; n=1 aktif ditolak.
        Bila seluruh putaran terencana sudah final dan NBK belum dikunci, rollback membuka kembali putaran final terakhir (termasuk putaran 1), menambah revisi dan mewajibkan tinjau ulang.
        Finalisasi wajib semua panelis/item lengkap; workflowVersion>=1 juga mengharuskan receipt selesai
        valid setiap panelis efektif. Latihan terbuka dan finalNBK terkunci menolak aksi putaran.
        RoundNumber harus sama dengan putaran aktif untuk mencegah aksi stale.
        Round yang sudah ada diaktifkan kembali tanpa duplikasi nomor/ID.
         Kirim roundRevision saat ini; omission hanya kompatibel pada revisi1. Rollback menaikkan revisi yang dibuka kembali dan respons harus ditinjau ulang. Snapshot final immutable; finalisasi ulang menambah arsip revisi baru.
      parameters:
        - name: action
          in: path
          required: true
          schema:
            type: string
            enum:
              - finalize
              - rollback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - confirmation
                - roundNumber
              properties:
                roundNumber:
                  type: integer
                  minimum: 1
                confirmation:
                  type: string
                  enum:
                    - FINALISASI PUTARAN
                    - ROLLBACK PUTARAN
                roundRevision:
                  type: integer
                  minimum: 1
            examples:
              finalize:
                value:
                  confirmation: FINALISASI PUTARAN
                  roundNumber: 1
              rollback:
                value:
                  confirmation: ROLLBACK PUTARAN
                  roundNumber: 2
      responses:
        '200':
          description: Round berikutnya aktif, round terakhir finalized, atau round sebelumnya diaktifkan kembali
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Round'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/ProtectedError'
