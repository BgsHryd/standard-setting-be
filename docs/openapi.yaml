    CandidateDefinitionRevision:
      type: object
      description: Riwayat definisi kandidat yang disimpan server; client tidak boleh menimpa riwayat.
      properties:
        version:
          type: integer
          minimum: 0
        definition:
          type: string
        actorId:
          type: string
        createdAt:
          type: string
          format: date-time
    SnapshotPanelist:
      type: object
      description: Identitas dan status tepat saat finalisasi; tidak diganti oleh status akun saat laporan dibaca.
      properties:
        panelistId:
          type: string
        panelistName:
          type: string
        included:
          type: boolean
        active:
          type: boolean
        removed:
          type: boolean
        exclusionReason:
          type: string
    RoundScopeInput:
      type: "object"
      required:
        - "roundNumber"
        - "roundRevision"
      properties:
        roundNumber:
          type: "integer"
          minimum: 1
        roundRevision:
          type: "integer"
          minimum: 1
    RoundReceipt:
      type: "object"
      required:
        - "panelistId"
        - "roundRevision"
        - "candidateVersion"
        - "versions"
        - "submittedAt"
      properties:
        panelistId:
          type: "string"
        roundRevision:
          type: "integer"
          minimum: 1
        candidateVersion:
          type: "integer"
          minimum: 0
        versions:
          type: "object"
          additionalProperties:
            type: "integer"
          description: "Peta ID butir ke versi respons yang diselesaikan panelis."
        submittedAt:
          type: "string"
          format: "date-time"
          nullable: true
          description: "Null pada respons reopen. Receipt internal round tidak diekspos sebagai daftar kepada panelis lain."
    PracticeSession:
      type: "object"
      properties:
        version:
          type: "integer"
          minimum: 0
        startedAt:
          type: "string"
          format: "date-time"
          description: "Zero time sebelum sesi dimulai."
        finishedAt:
          type: "string"
          format: "date-time"
          nullable: true
        answers:
          type: "object"
          additionalProperties:
            "$ref": "#/components/schemas/Answer"
    PracticeView:
      type: "object"
      properties:
        message:
          type: string
          description: Penjelasan ketersediaan latihan di luar periode proyek.
        enabled:
          type: "boolean"
        open:
          type: "boolean"
          description: "Proyek aktif, simulasi diaktifkan dan latihan mapel belum ditutup PIC."
        readOnly:
          type: "boolean"
          description: "Latihan ditutup, sudah selesai, timer 10 menit sudah habis, atau di luar periode proyek."
        expiresAt:
          type: "string"
          format: "date-time"
          nullable: true
        session:
          "$ref": "#/components/schemas/PracticeSession"
        items:
          type: "array"
          items:
            "$ref": "#/components/schemas/Item"
          description: "Tiga butir contoh terpisah dari bank dan hasil penilaian nyata."
    PracticeVersionInput:
      type: "object"
      required:
        - "version"
      properties:
        version:
          type: "integer"
          minimum: 1
          description: "Version sesi dari respons latihan terakhir."
    PracticeAnswerInput:
      allOf:
        - "$ref": "#/components/schemas/PracticeVersionInput"
        - type: "object"
          required:
            - "answer"
          properties:
            answer:
              "$ref": "#/components/schemas/Answer"
    EndPracticeInput:
      type: "object"
      required:
        - "projectVersion"
        - "confirmation"
      properties:
        projectVersion:
          type: "integer"
          minimum: 0
        confirmation:
          type: "string"
          enum:
            - "MULAI PENILAIAN"
    ExtendRoundPlanInput:
      type: "object"
      required:
        - "projectVersion"
        - "confirmation"
      properties:
        projectVersion:
          type: "integer"
          minimum: 0
        confirmation:
          type: "string"
          enum:
            - "TAMBAH PUTARAN"
    FinalNBKInput:
      allOf:
        - "$ref": "#/components/schemas/RoundScopeInput"
        - type: "object"
          required:
            - "projectVersion"
            - "reason"
            - "confirmation"
          properties:
            projectVersion:
              type: "integer"
              minimum: 0
            reason:
              type: "string"
              minLength: 1
              maxLength: 1000
            confirmation:
              type: "string"
              enum:
                - "TETAPKAN NBK FINAL"
    NBKDecision:
      type: "object"
      properties:
        snapshotId:
          type: "string"
        roundNumber:
          type: "integer"
          minimum: 1
        revision:
          type: "integer"
          minimum: 1
        statistics:
          "$ref": "#/components/schemas/ItemResult"
        actorId:
          type: "string"
        reason:
          type: "string"
          maxLength: 1000
        lockedAt:
          type: "string"
          format: "date-time"
    ParticipantAccountIdentity:
      type: "object"
      required:
        - "name"
        - "username"
      properties:
        name:
          type: "string"
          minLength: 1
          maxLength: 200
        username:
          type: "string"
          minLength: 3
          maxLength: 80
          pattern: "^[a-z0-9][a-z0-9._-]{2,79}$"
          description: "Di-trim dan dinormalisasi huruf kecil sebelum validasi; unik secara global."
    ParticipantAccountInput:
      allOf:
        - "$ref": "#/components/schemas/ParticipantAccountIdentity"
        - type: "object"
          required:
            - "projectId"
            - "projectVersion"
            - "subjectCode"
            - "role"
          properties:
            projectId:
              type: "string"
            projectVersion:
              type: "integer"
              minimum: 0
            subjectCode:
              type: "string"
            role:
              type: "string"
              enum:
                - "pic_mapel"
                - "panelis"
            slotId:
              type: "string"
              description: "Opsional. Bila dikirim harus slot kosong pada mapel/role yang sesuai; bila kosong, isi slot kosong pertama atau buat slot baru."
    ParticipantAccountEdit:
      allOf:
        - "$ref": "#/components/schemas/ParticipantAccountIdentity"
        - type: "object"
          required:
            - "projectVersion"
          properties:
            projectVersion:
              type: "integer"
              minimum: 0
    AccountInput:
      type: "object"
      properties:
        slotId:
          type: "string"
        name:
          type: "string"
        role:
          type: "string"
          enum:
            - "pic_mapel"
            - "panelis"
        subjectCode:
          type: "string"
        username:
          type: "string"
          description: "Opsional, kosong membuat username otomatis pada akun baru."
    ProjectWorkbookError:
      allOf:
        - "$ref": "#/components/schemas/WorkbookError"
        - type: "object"
          required:
            - "sheet"
          properties:
            sheet:
              type: "string"
              enum:
                - "Proyek"
                - "Mapel"
                - "Butir"
                - "Personel"
    ProjectWorkbookPreview:
      type: "object"
      required:
        - "valid"
        - "applied"
        - "count"
        - "errors"
      properties:
        valid:
          type: "boolean"
        applied:
          type: "boolean"
        count:
          type: "integer"
          minimum: 0
          maximum: 5000
          description: "Jumlah baris data tidak kosong pada empat sheet input."
        errors:
          type: "array"
          items:
            "$ref": "#/components/schemas/ProjectWorkbookError"
        project:
          "$ref": "#/components/schemas/Project"
        accounts:
          type: "array"
          items:
            "$ref": "#/components/schemas/AccountInput"
          description: "Identitas rencana akun; preview tidak memuat ID user/password. Username kosong akan diisi generator saat apply."
    TelemetryInput:
      type: "object"
      required:
        - "roundNumber"
        - "roundRevision"
        - "state"
      properties:
        roundNumber:
          type: "integer"
          minimum: 1
          maximum: 20
        roundRevision:
          type: "integer"
          minimum: 1
        state:
          type: "string"
          enum:
            - "online"
            - "degraded"
            - "offline"
        failures:
          type: "integer"
          minimum: 0
          maximum: 20
        medianMs:
          type: "number"
          minimum: 0
          maximum: 120000
        timingSamples:
          type: "integer"
          minimum: 0
          maximum: 20
        offlineSeconds:
          type: "number"
          minimum: 0
          maximum: 86400
        answerTimingSeconds:
          type: "array"
          maxItems: 20
          items:
            type: "number"
            minimum: 0.2
            maximum: 86400
          description: "Sampel durasi isian dalam detik, ringkasan dihitung server; sampel mentah tidak disimpan."
    PanelistTelemetry:
      type: "object"
      description: "Observasi browser terakhir untuk satu panelis/proyek/mapel/nomor/revisi putaran nyata. Bukan penilaian kualitas jawaban atau diagnosis jaringan."
      properties:
        userId:
          type: "string"
        projectId:
          type: "string"
        subjectCode:
          type: "string"
        roundNumber:
          type: "integer"
        roundRevision:
          type: "integer"
        state:
          type: "string"
          enum:
            - "online"
            - "degraded"
            - "offline"
        failures:
          type: "integer"
        medianMs:
          type: "number"
        timingSamples:
          type: "integer"
        offlineSeconds:
          type: "number"
        connectionWarning:
          type: "boolean"
        answerTimingSamples:
          type: "integer"
        medianAnswerSeconds:
          type: "number"
        speedWarning:
          type: "boolean"
        lastActive:
          type: "string"
          format: "date-time"
    UpdatedResult:
      type: "object"
      properties:
        updated:
          type: "boolean"
          example: true
    RemovedResult:
      type: "object"
      properties:
        removed:
          type: "boolean"
          example: true

    FinalNBKChoice:
      type: object
      properties:
        snapshotId:
          type: string
        roundNumber:
          type: integer
        revision:
          type: integer
        statistics:
          $ref: '#/components/schemas/ItemResult'
